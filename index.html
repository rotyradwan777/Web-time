<!DOCTYPE html>
<html lang="en">
<head>
    <title>Bright Future School - Home</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        /* --- RESET & BASE STYLES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background: #f0f4f8;
            color: #243b53;
            min-height: 100vh;
            padding-bottom: 60px;
        }

        /* --- HEADER --- */
        h1 {
            text-align: center;
            font-size: 2.5rem;
            color: #102a43;
            padding: 30px 20px 15px 20px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        /* --- STYLISH NAVIGATION BAR --- */
        nav {
            background: #ffffff;
            max-width: 850px;
            margin: 0 auto 40px auto;
            padding: 10px 15px;
            border-radius: 50px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            border: 1px solid #e4e7eb;
            position: sticky;
            top: 15px;
            z-index: 1000;
        }

        nav a {
            color: #486581;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            padding: 8px 18px;
            border-radius: 25px;
            transition: all 0.25s ease-in-out;
        }

        /* Hover & Active States */
        nav a:hover {
            color: #0052cc;
            background-color: #f0f4ff;
        }

        nav a.active {
            color: #ffffff;
            background-color: #0052cc;
            box-shadow: 0 4px 12px rgba(0, 82, 204, 0.25);
        }

        /* --- CONTENT CARD CONTAINER --- */
        .content-box {
            max-width: 850px;
            margin: 0 auto;
            padding: 0 20px;
        }

        section {
            background: #ffffff;
            border-radius: 16px;
            padding: 35px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            border: 1px solid #e4e7eb;
        }

        section h2 {
            font-size: 1.8rem;
            color: #102a43;
            margin-bottom: 20px;
            position: relative;
            padding-bottom: 10px;
        }

        /* Accent bar under titles */
        section h2::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 45px;
            height: 4px;
            background: #0052cc;
            border-radius: 2px;
        }

        /* Image Styling */
        .section-img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-radius: 12px;
            margin: 15px 0 20px 0;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
        }

        section p {
            font-size: 1.05rem;
            line-height: 1.7;
            color: #334e68;
        }

        /* --- RESPONSIVE DESIGN --- */
        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
            }
            nav {
                border-radius: 16px;
                padding: 8px;
            }
            nav a {
                padding: 6px 12px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>

    <h1>Bright Future School</h1>

    <!-- Navigation bar -->
    <nav>
        <a href="index.html" class="active">About</a>
        <a href="classes.html">Classes</a>
        <a href="schedule.html">Schedule</a>
        <a href="facilities.html">Facilities</a>
        <a href="events.html">Events</a>
        <a href="contact.html">Contact</a>
    </nav>

    <!-- Content Section -->
    <div class="content-box">
        <section id="about">
            <h2>About Our School</h2>
            <img src="https://images.unsplash.com/photo-1580582932707-520aed937b7b?auto=format&fit=crop&w=600&h=200&q=80" alt="School Building" class="section-img">
            <p>Welcome to Bright Future School! We provide high-quality education, modern classrooms, and a supportive environment for all students.</p>
        </section>
    </div>

</body>
</html>
