<!DOCTYPE html>
<html lang="en">
<head>
    <title>Bright Future School - Schedule</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        /* --- RESET & BASE STYLES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background: #f0f4f8;
            color: #243b53;
            min-height: 100vh;
            padding-bottom: 60px;
        }

        /* --- HEADER --- */
        h1 {
            text-align: center;
            font-size: 2.5rem;
            color: #102a43;
            padding: 30px 20px 15px 20px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        /* --- STYLISH NAVIGATION BAR --- */
        nav {
            background: #ffffff;
            max-width: 850px;
            margin: 0 auto 40px auto;
            padding: 10px 15px;
            border-radius: 50px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            border: 1px solid #e4e7eb;
            position: sticky;
            top: 15px;
            z-index: 1000;
        }

        nav a {
            color: #486581;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            padding: 8px 18px;
            border-radius: 25px;
            transition: all 0.25s ease-in-out;
        }

        /* Hover & Active States */
        nav a:hover {
            color: #0052cc;
            background-color: #f0f4ff;
        }

        nav a.active {
            color: #ffffff;
            background-color: #0052cc;
            box-shadow: 0 4px 12px rgba(0, 82, 204, 0.25);
        }

        /* --- CONTENT CARD CONTAINER --- */
        .content-box {
            max-width: 850px;
            margin: 0 auto;
            padding: 0 20px;
        }

        section {
            background: #ffffff;
            border-radius: 16px;
            padding: 35px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            border: 1px solid #e4e7eb;
        }

        section h2 {
            font-size: 1.8rem;
            color: #102a43;
            margin-bottom: 20px;
            position: relative;
            padding-bottom: 10px;
        }

        /* Accent bar under titles */
        section h2::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 45px;
            height: 4px;
            background: #0052cc;
            border-radius: 2px;
        }

        /* Image Styling */
        .section-img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-radius: 12px;
            margin: 15px 0 25px 0;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
        }

        /* Table Styling */
        .schedule-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .schedule-table th, 
        .schedule-table td {
            padding: 16px 20px;
            text-align: left;
        }

        .schedule-table th {
            background-color: #f0f4ff;
            color: #102a43;
            font-weight: 700;
            border-bottom: 2px solid #e4e7eb;
        }

        .schedule-table td {
            border-bottom: 1px solid #f0f4f8;
            color: #334e68;
            font-weight: 600;
        }

        .schedule-table tr:last-child td {
            border-bottom: none;
        }

        .schedule-table tr:nth-child(even) {
            background-color: #f8fafc;
        }

        .badge-open {
            color: #0052cc;
            background: #e6f0ff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            display: inline-block;
        }

        .badge-closed {
            color: #d64545;
            background: #ffe8e8;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            display: inline-block;
        }

        /* --- RESPONSIVE DESIGN --- */
        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
            }
            nav {
                border-radius: 16px;
                padding: 8px;
            }
            nav a {
                padding: 6px 12px;
                font-size: 0.85rem;
            }
            .schedule-table th, 
            .schedule-table td {
                padding: 12px 14px;
            }
        }
    </style>
</head>
<body>

    <h1>Bright Future School</h1>

    <!-- Navigation bar linking to all pages -->
    <nav>
        <a href="index.html">About</a>
        <a href="classes.html">Classes</a>
        <a href="schedule.html" class="active">Schedule</a>
        <a href="facilities.html">Facilities</a>
        <a href="events.html">Events</a>
        <a href="contact.html">Contact</a>
    </nav>

    <!-- Schedule Content Section -->
    <div class="content-box">
        <section id="schedule">
            <h2>School Hours & Schedule</h2>
            <img src="https://images.unsplash.com/photo-1506784983877-45594efa4cbe?auto=format&fit=crop&w=600&h=200&q=80" alt="School Clock" class="section-img">
            
            <table class="schedule-table">
                <thead>
                    <tr>
                        <th>Days</th>
                        <th>Hours</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>📅 Monday – Thursday</td>
                        <td>8:00 AM – 3:00 PM</td>
                        <td><span class="badge-open">Open</span></td>
                    </tr>
                    <tr>
                        <td>📅 Friday</td>
                        <td>8:00 AM – 12:30 PM</td>
                        <td><span class="badge-open">Half Day</span></td>
                    </tr>
                    <tr>
                        <td>📅 Saturday & Sunday</td>
                        <td>—</td>
                        <td><span class="badge-closed">Closed</span></td>
                    </tr>
                </tbody>
            </table>
        </section>
    </div>

</body>
</html>
